<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container{
            margin-top: 50px;
        }

        input{
            display: block;
            width: 250px;
            padding: 10px;
            margin: 10px auto;
        }

        button{
            padding: 10px 20px;
            background-color: red;
            color: white;
        }

        .card{
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid red;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Student Profile</h2>

        <input type="text" id="name" placeholder="Enter Student Name">
        <input type="text" id="roll" placeholder="Enter Roll Number">
        <input type="number" id="marks" placeholder="Enter Marks">

        <button onclick="displayProfile()">Display Profile</button>

        <div class="card" id="card">
            <h3>Student Profile Card</h3>
            <p><b>Name:</b> <span id="sname"></span></p>
            <p><b>Roll Number:</b> <span id="sroll"></span></p>
            <p><b>Marks:</b> <span id="smarks"></span></p>
            <p><b>Grade:</b> <span id="sgrade"></span></p>
        </div>
    </div>

    <script>
    function displayProfile(){

        let name = document.getElementById("name").value;
        let roll = document.getElementById("roll").value;
        let marks = Number(document.getElementById("marks").value);
        if(name =="" || roll=="" || marks==""){
            alert("Please fill all the fields")
        }
        else{
            let grade = "";

            if (marks >= 80) {
                grade = "A";
            }
            else if (marks >= 70) {
                grade = "B";
            }
            else if (marks >= 60) {
                grade = "C";
            }
            else {
                grade = "F";
            }

            document.getElementById("sname").innerHTML = name;
            document.getElementById("sroll").innerHTML = roll;
            document.getElementById("smarks").innerHTML = marks;
            document.getElementById("sgrade").innerHTML = grade;

            document.getElementById("card").style.display = "block";
            }
        }
    </script>

</body>
</html>
