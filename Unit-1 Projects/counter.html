<!DOCTYPE html>
<html>
<head>
    <title>Counter</title>

    <style>
        body
        {
            text-align: center;
            font-family: Arial;
            margin-top: 100px;
            background-color: #4b41a8;
        }

        h1
        {
            font-size: 50px;
            color: red;
            background-color: white;
            display: inline-block;
            padding: 15px 30px;
            border: 2px solid red;
            border-radius: 5px;
        }

        button
        {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            margin: 10px;
            border-radius: 5px;
        }

        button:hover
        {
            background-color: darkred;
        }
    </style>

</head>
<body>

    <h2 style="color: white;">Counter App</h2>

    <br><br>

    <h1 id="count">0</h1>

    <br><br>

    <button onclick="increase()">+1</button>
    <button onclick="decrease()">-1</button>
    <button onclick="reset()">Reset</button>

    <script>

        var count = 0;

        function increase()
        {
            count++;
            document.getElementById("count").innerHTML = count;
        }

        function decrease()
        {
            count--;
            document.getElementById("count").innerHTML = count;
        }

        function reset()
        {
            count = 0;
            document.getElementById("count").innerHTML = count;
        }

    </script>

</body>
</html>
